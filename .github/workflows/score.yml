name: Fetch and score
on:
  schedule: [{cron: "17 */3 * * *"}]   # every 3 hours
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python fetch_and_score.py --out docs/stories.json
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: |
          git config user.name "slant-meter-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/stories.json docs/stories.json.skipped; git diff --cached --quiet || git commit -m "Update stories" && git push
